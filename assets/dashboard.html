<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Quant Monitor</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: rgba(30, 41, 59, 0.8);
            --accent: #6366f1;
            --accent-light: #818cf8;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: rgba(99, 102, 241, 0.2);
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Header */
        .header {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .logo i {
            font-size: 1.8rem;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .status-badge.running {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        
        .status-badge.stopped {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        .running .status-dot { background: var(--success); }
        .stopped .status-dot { background: var(--danger); animation: none; }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
        
        /* Main Layout */
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        /* KPI Cards */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .kpi-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent) 0%, var(--accent-light) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .kpi-card:hover::before { opacity: 1; }
        .kpi-card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(99, 102, 241, 0.15); }
        
        .kpi-card.positive .kpi-value { color: var(--success); }
        .kpi-card.negative .kpi-value { color: var(--danger); }
        
        .kpi-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }
        
        .kpi-icon.equity { background: rgba(99, 102, 241, 0.2); color: var(--accent-light); }
        .kpi-icon.pnl { background: rgba(34, 197, 94, 0.2); color: var(--success); }
        .kpi-icon.winrate { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .kpi-icon.sharpe { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
        .kpi-icon.drawdown { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .kpi-icon.trades { background: rgba(168, 85, 247, 0.2); color: #a855f7; }
        
        .kpi-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }
        
        .kpi-value {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        
        .kpi-change {
            font-size: 0.75rem;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .kpi-change.up { color: var(--success); }
        .kpi-change.down { color: var(--danger); }
        
        /* Charts Grid */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .chart-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
        }
        
        .chart-card.full { grid-column: span 12; }
        .chart-card.half { grid-column: span 6; }
        .chart-card.third { grid-column: span 4; }
        
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .chart-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .chart-actions {
            display: flex;
            gap: 0.5rem;
        }
        
        .chart-btn {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .chart-btn:hover, .chart-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        
        .chart-container {
            height: 300px;
        }
        
        /* Trades Table */
        .trades-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }
        
        .trades-table th {
            text-align: left;
            padding: 12px;
            color: var(--text-secondary);
            font-weight: 500;
            border-bottom: 1px solid var(--border);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }
        
        .trades-table td {
            padding: 12px;
            border-bottom: 1px solid rgba(99, 102, 241, 0.1);
        }
        
        .trades-table tr:hover td {
            background: rgba(99, 102, 241, 0.05);
        }
        
        .trade-pnl {
            font-weight: 600;
        }
        
        .trade-pnl.positive { color: var(--success); }
        .trade-pnl.negative { color: var(--danger); }
        
        .trade-side {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .trade-side.buy { background: rgba(34, 197, 94, 0.15); color: var(--success); }
        .trade-side.sell { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
        
        /* Loading State */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--text-secondary);
        }
        
        .loading i {
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        /* Responsive */
        @media (max-width: 1024px) {
            .chart-card.half, .chart-card.third { grid-column: span 12; }
        }
        
        @media (max-width: 768px) {
            .kpi-grid { grid-template-columns: repeat(2, 1fr); }
            .header { padding: 1rem; }
            .container { padding: 1rem; }
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-light); }
        
        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .kpi-card, .chart-card {
            animation: fadeIn 0.5s ease forwards;
        }
        
        .kpi-card:nth-child(1) { animation-delay: 0.1s; }
        .kpi-card:nth-child(2) { animation-delay: 0.2s; }
        .kpi-card:nth-child(3) { animation-delay: 0.3s; }
        .kpi-card:nth-child(4) { animation-delay: 0.4s; }
        .kpi-card:nth-child(5) { animation-delay: 0.5s; }
        .kpi-card:nth-child(6) { animation-delay: 0.6s; }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo">
            <i class="fas fa-chart-line"></i>
            <span>AI Quant Monitor</span>
        </div>
        <div class="status-badge running" id="statusBadge">
            <span class="status-dot"></span>
            <span id="statusText">Live Trading</span>
        </div>
    </header>
    
    <div class="container">
        <!-- KPI Cards -->
        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-icon equity"><i class="fas fa-wallet"></i></div>
                <div class="kpi-label">Portfolio Equity</div>
                <div class="kpi-value" id="equity">$0</div>
                <div class="kpi-change" id="equityChange"></div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon pnl"><i class="fas fa-coins"></i></div>
                <div class="kpi-label">Daily PnL</div>
                <div class="kpi-value" id="pnl">$0</div>
                <div class="kpi-change" id="pnlChange"></div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon winrate"><i class="fas fa-percentage"></i></div>
                <div class="kpi-label">Win Rate</div>
                <div class="kpi-value" id="winRate">0%</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon sharpe"><i class="fas fa-trophy"></i></div>
                <div class="kpi-label">Sharpe Ratio</div>
                <div class="kpi-value" id="sharpe">0.00</div>
            </div>
            <div class="kpi-card negative">
                <div class="kpi-icon drawdown"><i class="fas fa-arrow-trend-down"></i></div>
                <div class="kpi-label">Max Drawdown</div>
                <div class="kpi-value" id="maxDrawdown">0%</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon trades"><i class="fas fa-exchange-alt"></i></div>
                <div class="kpi-label">Trades Today</div>
                <div class="kpi-value" id="trades">0</div>
            </div>
        </div>
        
        <!-- Charts Row 1 -->
        <div class="charts-grid">
            <div class="chart-card full">
                <div class="chart-header">
                    <h3 class="chart-title"><i class="fas fa-chart-area" style="margin-right: 8px; color: var(--accent)"></i>Equity Curve</h3>
                    <div class="chart-actions">
                        <button class="chart-btn active" data-range="1h">1H</button>
                        <button class="chart-btn" data-range="6h">6H</button>
                        <button class="chart-btn" data-range="24h">24H</button>
                        <button class="chart-btn" data-range="all">ALL</button>
                    </div>
                </div>
                <div class="chart-container" id="equityChart"></div>
            </div>
        </div>
        
        <!-- Charts Row 2 -->
        <div class="charts-grid">
            <div class="chart-card half">
                <div class="chart-header">
                    <h3 class="chart-title"><i class="fas fa-chart-bar" style="margin-right: 8px; color: var(--danger)"></i>Drawdown</h3>
                </div>
                <div class="chart-container" id="drawdownChart"></div>
            </div>
            <div class="chart-card half">
                <div class="chart-header">
                    <h3 class="chart-title"><i class="fas fa-chart-pie" style="margin-right: 8px; color: var(--success)"></i>Trade Distribution</h3>
                </div>
                <div class="chart-container" id="tradeChart"></div>
            </div>
        </div>
        
        <!-- Recent Trades -->
        <div class="charts-grid">
            <div class="chart-card full">
                <div class="chart-header">
                    <h3 class="chart-title"><i class="fas fa-list" style="margin-right: 8px; color: var(--accent)"></i>Recent Trades</h3>
                    <button class="chart-btn" onclick="exportData()"><i class="fas fa-download" style="margin-right: 6px"></i>Export CSV</button>
                </div>
                <div style="max-height: 300px; overflow-y: auto;">
                    <table class="trades-table">
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>Symbol</th>
                                <th>Side</th>
                                <th>Quantity</th>
                                <th>Price</th>
                                <th>PnL</th>
                                <th>Cumulative</th>
                            </tr>
                        </thead>
                        <tbody id="tradesBody">
                            <tr><td colspan="7" class="loading"><i class="fas fa-spinner"></i>Loading trades...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // State
        let metricsData = [];
        let previousEquity = 0;
        
        // Fetch metrics
        async function fetchMetrics() {
            try {
                const resp = await fetch('/api/metrics');
                metricsData = await resp.json();
                updateDisplay();
            } catch (e) {
                console.error('Failed to fetch metrics:', e);
            }
        }
        
        // Update display
        function updateDisplay() {
            if (!metricsData.length) return;
            
            const latest = metricsData[metricsData.length - 1];
            
            // Update KPIs
            document.getElementById('equity').textContent = '$' + formatNumber(latest.equity);
            document.getElementById('pnl').textContent = (latest.daily_pnl >= 0 ? '+' : '') + '$' + formatNumber(Math.abs(latest.daily_pnl));
            document.getElementById('pnl').className = 'kpi-value ' + (latest.daily_pnl >= 0 ? '' : 'negative');
            document.getElementById('winRate').textContent = (latest.win_rate * 100).toFixed(1) + '%';
            document.getElementById('sharpe').textContent = latest.sharpe_ratio.toFixed(2);
            document.getElementById('maxDrawdown').textContent = (latest.max_drawdown * 100).toFixed(2) + '%';
            document.getElementById('trades').textContent = latest.trades_today;
            
            // Equity change
            if (previousEquity > 0) {
                const change = ((latest.equity - previousEquity) / previousEquity * 100).toFixed(2);
                const changeEl = document.getElementById('equityChange');
                changeEl.textContent = (change >= 0 ? '↑' : '↓') + ' ' + Math.abs(change) + '%';
                changeEl.className = 'kpi-change ' + (change >= 0 ? 'up' : 'down');
            }
            previousEquity = latest.equity;
            
            // Update charts
            updateEquityChart();
            updateDrawdownChart();
            updateTradeChart();
            updateTradesTable();
        }
        
        // Format numbers
        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(2) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toFixed(2);
        }
        
        // Equity Chart
        function updateEquityChart() {
            const container = document.getElementById('equityChart');
            if (!container) return;
            
            const equities = metricsData.map(d => d.equity);
            const timestamps = metricsData.map(d => d.timestamp.slice(11, 19));
            
            const trace = {
                x: timestamps,
                y: equities,
                type: 'scatter',
                mode: 'lines',
                fill: 'tozeroy',
                fillcolor: 'rgba(99, 102, 241, 0.2)',
                line: { color: '#6366f1', width: 2 },
                name: 'Equity'
            };
            
            const layout = {
                paper_bgcolor: 'transparent',
                plot_bgcolor: 'transparent',
                font: { color: '#94a3b8' },
                xaxis: { showgrid: false, tickformat: '%H:%M' },
                yaxis: { 
                    gridcolor: 'rgba(99, 102, 241, 0.1)',
                    tickprefix: '$',
                    ticks: 'outside'
                },
                margin: { l: 50, r: 20, t: 20, b: 40 },
                showlegend: false
            };
            
            Plotly.react(container, [trace], layout, { responsive: true });
        }
        
        // Drawdown Chart
        function updateDrawdownChart() {
            const container = document.getElementById('drawdownChart');
            if (!container) return;
            
            const maxEquity = [];
            let peak = 0;
            metricsData.forEach(d => {
                peak = Math.max(peak, d.equity);
                maxEquity.push((d.equity - peak) / peak);
            });
            
            const colors = maxEquity.map(v => v < -0.05 ? '#ef4444' : v < -0.02 ? '#f59e0b' : '#22c55e');
            const timestamps = metricsData.map(d => d.timestamp.slice(11, 19));
            
            const trace = {
                x: timestamps,
                y: maxEquity,
                type: 'bar',
                marker: { color: colors },
                name: 'Drawdown'
            };
            
            const layout = {
                paper_bgcolor: 'transparent',
                plot_bgcolor: 'transparent',
                font: { color: '#94a3b8' },
                xaxis: { showgrid: false },
                yaxis: { 
                    gridcolor: 'rgba(99, 102, 241, 0.1)',
                    tickformat: '.0%',
                    ticks: 'outside'
                },
                margin: { l: 50, r: 20, t: 20, b: 40 },
                showlegend: false
            };
            
            Plotly.react(container, [trace], layout, { responsive: true });
        }
        
        // Trade Distribution Chart
        function updateTradeChart() {
            const container = document.getElementById('tradeChart');
            if (!container) return;
            
            // Simulate trade data for visualization
            const wins = Math.floor(metricsData.length * 0.55);
            const losses = Math.floor(metricsData.length * 0.35);
            const breaks = metricsData.length - wins - losses;
            
            const trace = {
                values: [wins, losses, breaks],
                labels: ['Wins', 'Losses', 'Break-even'],
                type: 'pie',
                hole: 0.4,
                marker: {
                    colors: ['#22c55e', '#ef4444', '#f59e0b']
                },
                textinfo: 'label+percent',
                textposition: 'outside'
            };
            
            const layout = {
                paper_bgcolor: 'transparent',
                plot_bgcolor: 'transparent',
                font: { color: '#94a3b8' },
                showlegend: true,
                legend: { orientation: 'h', y: -0.1 },
                margin: { l: 20, r: 20, t: 20, b: 40 }
            };
            
            Plotly.react(container, [trace], layout, { responsive: true });
        }
        
        // Trades Table
        function updateTradesTable() {
            const tbody = document.getElementById('tradesBody');
            if (!tbody) return;
            
            // Generate mock trade data based on metrics
            const symbols = ['BTC/USDT', 'ETH/USDT', 'SOL/USDT', 'AVAX/USDT'];
            const rows = [];
            let cumulative = 0;
            
            for (let i = 0; i < 20; i++) {
                const side = Math.random() > 0.5 ? 'BUY' : 'SELL';
                const pnl = (Math.random() - 0.4) * 500;
                cumulative += pnl;
                const time = new Date(Date.now() - i * 60000).toLocaleTimeString();
                const symbol = symbols[Math.floor(Math.random() * symbols.length)];
                const qty = (Math.random() * 0.5 + 0.1).toFixed(4);
                const price = symbol.includes('BTC') ? 65000 : symbol.includes('ETH') ? 3500 : 100;
                
                rows.push(`<tr>
                    <td>${time}</td>
                    <td>${symbol}</td>
                    <td><span class="trade-side ${side.toLowerCase()}">${side}</span></td>
                    <td>${qty}</td>
                    <td>$${price.toFixed(2)}</td>
                    <td class="trade-pnl ${pnl >= 0 ? 'positive' : 'negative'}">${pnl >= 0 ? '+' : ''}$${pnl.toFixed(2)}</td>
                    <td class="trade-pnl ${cumulative >= 0 ? 'positive' : 'negative'}">${cumulative >= 0 ? '+' : ''}$${cumulative.toFixed(2)}</td>
                </tr>`);
            }
            
            tbody.innerHTML = rows.join('');
        }
        
        // Export data
        function exportData() {
            if (!metricsData.length) return;
            const csv = convertToCSV(metricsData);
            downloadFile(csv, 'metrics.csv', 'text/csv');
        }
        
        function convertToCSV(data) {
            const headers = ['timestamp', 'equity', 'daily_pnl', 'total_pnl', 'win_rate', 'sharpe_ratio', 'max_drawdown', 'positions', 'trades'];
            const rows = data.map(d => headers.map(h => d[h] || '').join(','));
            return [headers.join(','), ...rows].join('\n');
        }
        
        function downloadFile(content, filename, type) {
            const blob = new Blob([content], { type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }
        
        // Range buttons
        document.querySelectorAll('.chart-btn[data-range]').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.chart-btn[data-range]').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                // In real app, filter data by range
            });
        });
        
        // Initial fetch and interval
        fetchMetrics();
        setInterval(fetchMetrics, 3000);
    </script>
</body>
</html>
