[project]
name = "ai-quant-nautilus"
version = "0.1.0"
description = "AI-driven crypto quant closed-loop with NautilusTrader backtest engine"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "SQLAlchemy>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "ta>=0.11.0",
    "APScheduler>=3.10",
    "plotly>=6.0",
]

[project.optional-dependencies]
nautilus = [
    "nautilus_trader>=2.0.0rc1; python_version>='3.12'",
]
dev = ["pytest>=8.0", "pytest-asyncio", "ruff", "mypy"]

[project.scripts]
aqn = "ai_quant_nautilus.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: tests that run real backtests and take >30s",
    "nautilus: requires nautilus_trader installed (Python 3.12+)",
]
